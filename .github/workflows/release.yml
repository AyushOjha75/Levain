name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/levain-release.jks"

      - name: Build signed release APK
        env:
          LEVAIN_KEYSTORE_PATH: ${{ runner.temp }}/levain-release.jks
          LEVAIN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LEVAIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LEVAIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "levain-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Levain $GITHUB_REF_NAME" \
            --generate-notes \
            "levain-${GITHUB_REF_NAME}.apk"
